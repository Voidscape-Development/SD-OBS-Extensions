<!doctype html>
<html>
	<head lang="en">
		<title>OBS Connection Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<link rel="stylesheet" href="property-inspector.css" />
	</head>

	<body>
		<nav class="tabs">
			<button type="button" data-tab="settings" class="active">Settings</button>
			<button type="button" data-tab="connections">Connections</button>
		</nav>

		<div class="tab-panel" data-tab="settings">
			<sdpi-item label="Instance">
				<sdpi-select
					id="instance"
					setting="instanceId"
					datasource="instances"
					placeholder="All instances"
				></sdpi-select>
			</sdpi-item>

			<sdpi-item label="On press">
				<sdpi-checkbox setting="pressToToggle" default="true" label="Toggle the connection"></sdpi-checkbox>
			</sdpi-item>

			<div class="hint">
				The key shows the instance's live status. Add, edit and remove instances from the Connections tab, which every
				action has.
			</div>
		</div>

		<div id="connections" class="tab-panel" data-tab="connections" hidden></div>

		<script src="connections.js"></script>
	</body>
</html>
