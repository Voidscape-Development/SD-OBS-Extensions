<!doctype html>
<html>
	<head lang="en">
		<title>OBS Filter Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<link rel="stylesheet" href="property-inspector.css" />
	</head>

	<body>
		<sdpi-item label="OBS Instance">
			<sdpi-select
				id="instance"
				setting="instanceId"
				datasource="instances"
				placeholder="Select an instance"
			></sdpi-select>
		</sdpi-item>

		<sdpi-item label="Source">
			<sdpi-select id="source" setting="sourceName" datasource="sources" placeholder="Select a source"></sdpi-select>
		</sdpi-item>

		<sdpi-item label="Filter">
			<sdpi-select id="filter" setting="filterName" datasource="filters" placeholder="Select a filter"></sdpi-select>
		</sdpi-item>

		<div id="hint" class="hint"></div>

		<script>
			(() => {
				const client = SDPIComponents.streamDeckClient;
				const el = (id) => document.getElementById(id);

				/**
				 * The plugin reads the action's persisted settings to work out what
				 * to put in a dependent dropdown, and the parent's own save is a
				 * round trip to the Stream Deck. Waiting a moment keeps the child
				 * from being refreshed against the previous selection.
				 */
				const SETTLE_MS = 300;

				function refresh(...ids) {
					setTimeout(() => {
						for (const id of ids) {
							el(id)?.refresh?.();
						}
					}, SETTLE_MS);
				}

				async function updateHint() {
					const hint = el("hint");

					try {
						const response = await client.get(
							"sendToPlugin",
							"sendToPropertyInspector",
							(msg) => msg.payload?.event === "capabilities",
							{ event: "capabilities" },
						);

						hint.classList.toggle("warn", !response.payload.connected);
						hint.textContent = response.payload.connected
							? "The key shows whether the filter is on, and follows changes made in OBS."
							: "Not connected. Connect this instance from an OBS Connection action to load sources and filters.";
					} catch {
						hint.textContent = "";
					}
				}

				el("instance").addEventListener("valuechange", () => {
					refresh("source", "filter");
					updateHint();
				});

				el("source").addEventListener("valuechange", () => refresh("filter"));

				updateHint();
			})();
		</script>
	</body>
</html>
